<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="190" viewBox="0 0 1280 190" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.c{opacity:0;animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.ln{transform-box:fill-box;transform-origin:left;animation:ln 1.6s cubic-bezier(.2,.8,.2,1) forwards;transform:scaleX(0)}
@keyframes ln{to{transform:scaleX(1)}}
.sh{animation:sh 4s linear infinite}
@keyframes sh{from{transform:translateX(-120px)}to{transform:translateX(420px)}}</style><defs><linearGradient id="g0" x1="0" x2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#EC4899"/></linearGradient><linearGradient id="g2" x1="0" x2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#34D399"/></linearGradient><linearGradient id="g3" x1="0" x2="1"><stop offset="0" stop-color="#EA580C"/><stop offset="1" stop-color="#FBBF24"/></linearGradient><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="k0"><rect x="0" y="10" width="299" height="170" rx="22"/></clipPath><clipPath id="k1"><rect x="327" y="10" width="299" height="170" rx="22"/></clipPath><clipPath id="k2"><rect x="654" y="10" width="299" height="170" rx="22"/></clipPath><clipPath id="k3"><rect x="981" y="10" width="299" height="170" rx="22"/></clipPath></defs><g class="c" style="animation-delay:0.00s"><rect x="0" y="10" width="299" height="170" rx="22" fill="#0B1229"/><rect x="1" y="11" width="297" height="168" rx="21" fill="none" stroke="url(#g0)" stroke-opacity=".55" stroke-width="2"/><g clip-path="url(#k0)"><rect class="sh" style="animation-delay:0.0s" x="0" y="10" width="120" height="170" fill="url(#shine)" transform="skewX(-12)"/></g><text x="26" y="84" fill="url(#g0)" font-size="52" font-weight="800">89k+</text><text x="26" y="118" fill="#F1F5F9" font-size="18" font-weight="700">строк TypeScript</text><text x="26" y="143" fill="#94A3B8" font-size="14">сервер, веб и мобильное</text><rect class="ln" style="animation-delay:0.30s" x="26" y="158" width="247" height="4" rx="2" fill="url(#g0)"/></g><g class="c" style="animation-delay:0.15s"><rect x="327" y="10" width="299" height="170" rx="22" fill="#0B1229"/><rect x="328" y="11" width="297" height="168" rx="21" fill="none" stroke="url(#g1)" stroke-opacity=".55" stroke-width="2"/><g clip-path="url(#k1)"><rect class="sh" style="animation-delay:0.7s" x="327" y="10" width="120" height="170" fill="url(#shine)" transform="skewX(-12)"/></g><text x="353" y="84" fill="url(#g1)" font-size="52" font-weight="800">10</text><text x="353" y="118" fill="#F1F5F9" font-size="18" font-weight="700">модулей на NestJS</text><text x="353" y="143" fill="#94A3B8" font-size="14">чат, звонки, офис, поиск…</text><rect class="ln" style="animation-delay:0.45s" x="353" y="158" width="247" height="4" rx="2" fill="url(#g1)"/></g><g class="c" style="animation-delay:0.30s"><rect x="654" y="10" width="299" height="170" rx="22" fill="#0B1229"/><rect x="655" y="11" width="297" height="168" rx="21" fill="none" stroke="url(#g2)" stroke-opacity=".55" stroke-width="2"/><g clip-path="url(#k2)"><rect class="sh" style="animation-delay:1.4s" x="654" y="10" width="120" height="170" fill="url(#shine)" transform="skewX(-12)"/></g><text x="680" y="84" fill="url(#g2)" font-size="52" font-weight="800">3</text><text x="680" y="118" fill="#F1F5F9" font-size="18" font-weight="700">платформы</text><text x="680" y="143" fill="#94A3B8" font-size="14">веб, iOS и Android</text><rect class="ln" style="animation-delay:0.60s" x="680" y="158" width="247" height="4" rx="2" fill="url(#g2)"/></g><g class="c" style="animation-delay:0.45s"><rect x="981" y="10" width="299" height="170" rx="22" fill="#0B1229"/><rect x="982" y="11" width="297" height="168" rx="21" fill="none" stroke="url(#g3)" stroke-opacity=".55" stroke-width="2"/><g clip-path="url(#k3)"><rect class="sh" style="animation-delay:2.1s" x="981" y="10" width="120" height="170" fill="url(#shine)" transform="skewX(-12)"/></g><text x="1007" y="84" fill="url(#g3)" font-size="52" font-weight="800">2 мес.</text><text x="1007" y="118" fill="#F1F5F9" font-size="18" font-weight="700">от первого коммита</text><text x="1007" y="143" fill="#94A3B8" font-size="14">до работы у живых людей</text><rect class="ln" style="animation-delay:0.75s" x="1007" y="158" width="247" height="4" rx="2" fill="url(#g3)"/></g></svg>
