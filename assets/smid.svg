<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.row{opacity:0;animation:rowin .6s ease-out forwards}
@keyframes rowin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
.line{stroke-dasharray:900;stroke-dashoffset:900;animation:line 6s ease-in-out infinite}
@keyframes line{0%{stroke-dashoffset:900}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
.scan{animation:scan 3s linear infinite}
@keyframes scan{from{transform:translateX(0)}to{transform:translateX(276px)}}
.gauge{stroke-dasharray:0 400;animation:gauge 5s ease-in-out infinite alternate}
@keyframes gauge{from{stroke-dasharray:70 400}to{stroke-dasharray:150 400}}
.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.warn{transform-box:fill-box;transform-origin:center;animation:warn 1.6s ease-out infinite}
@keyframes warn{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.4);opacity:0}}
.glow{animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.3}to{opacity:.7}}
.v1,.v2{animation:sw 4s steps(1) infinite}.v2{animation-delay:-2s}
@keyframes sw{0%{opacity:1}50%{opacity:0}}
