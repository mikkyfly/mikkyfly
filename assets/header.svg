text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.blob{animation:drift 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.b2{animation-duration:19s;animation-direction:alternate-reverse}
.b3{animation-duration:23s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-30px) scale(1.15)}100%{transform:translate(-40px,25px) scale(.95)}}
.draw{stroke-dasharray:32;stroke-dashoffset:32;animation:draw 5s ease-in-out infinite}
@keyframes draw{0%,12%{stroke-dashoffset:32}32%,82%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:32}}
.halo{animation:halo 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%,100%{opacity:.35;transform:scale(.92)}50%{opacity:.75;transform:scale(1.08)}}
.f1{animation:float 6s ease-in-out infinite}
.f2{animation:float 7s ease-in-out -2s infinite}
.f3{animation:float 8s ease-in-out -4s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.tw{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.9}}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.wave{animation:wave 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:70% 80%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-8deg)}}
